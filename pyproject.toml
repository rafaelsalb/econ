[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econ"
version = "0.4.0"
description = "Brazil macro model hub: vintage-aware data, benchmarks, school models, forecast registry"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pyarrow>=15.0",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
# pytest-cov is a dev dependency approved by the owner (2026-11-24) for the
# merge-time coverage-delta gate; recorded per the dependency sign-off rule.
dev = ["pytest>=8.0", "pytest-cov>=6.0"]

[project.scripts]
econ = "econ.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
