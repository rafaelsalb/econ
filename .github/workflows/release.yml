name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Print the release without committing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Release
        run: |
          ARGS="--bump ${{ inputs.bump }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m econ.cli dev release $ARGS
      - name: Push commit and tag
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin HEAD:main
          git push origin --tags
