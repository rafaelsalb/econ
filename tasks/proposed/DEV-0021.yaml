id: DEV-0021
title: Define defect codes D1-D7 in the research prompts
status: proposed
risk: 2
priority: 90
created: '2026-11-24'
goal: Every research prompt that asks for defect codes states what each of D1 to
  D7 means and when it blocks, matching the taxonomy table in docs/METHOD.md. A
  test fails if a code is missing from a rendered prompt.
acceptance:
- python -m pytest tests/test_research_prompt_codes.py -q
- python -m econ.cli agents check
scope:
  allow:
  - config/prompts/*.md
  - .opencode/agents/econ-*.md
  - tests/test_research_prompt_codes.py
  deny:
  - specs/**
  - data/**
  - registry/**
  - eval/**
limits:
  max_review_rounds: 2
  max_usd: 5.0
  max_changed_files: 9
  max_diff_lines: 400
source:
  kind: local
notes: 'Run after DEV-0019, which lets the implementer render research agents. Never
  hand-edit rendered files: run `python -m econ.cli agents render`. Do not give
  agents docs/METHOD.md as an input: it reports lockbox results.'
