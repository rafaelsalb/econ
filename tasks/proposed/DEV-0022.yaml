id: DEV-0022
title: Remove the stale econ.audit permission
status: proposed
risk: 2
priority: 80
created: '2026-11-24'
goal: critic_adequacy no longer has shell permission for `python -m econ.audit *`,
  a module that does not exist. A test fails if any research agent is allowed to
  run an econ module that cannot be imported.
acceptance:
- python -m pytest tests/test_research_permissions.py -q
- python -m econ.cli agents check
scope:
  allow:
  - config/agents.yaml
  - .opencode/agents/econ-*.md
  - tests/test_research_permissions.py
  deny:
  - specs/**
  - data/**
  - registry/**
  - eval/**
limits:
  max_review_rounds: 2
  max_usd: 5.0
  max_changed_files: 9
  max_diff_lines: 400
source:
  kind: local
notes: 'Run after DEV-0019, which lets the implementer render research agents. Never
  hand-edit rendered files: run `python -m econ.cli agents render`. '
