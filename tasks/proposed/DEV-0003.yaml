id: DEV-0003
title: Add the read-only /forecasts view with an inline SVG chart
status: proposed
risk: 2
priority: 50
created: '2026-11-24'
goal: |
  Extend the dashboard built by DEV-0002 with the `/forecasts` view.

  `/forecasts` reads the append-only registry through
  `econ.registry.read_forecasts()`, keeps the latest registered forecast per
  `model_id`/`target`/`horizon` (latest `produced_at`, ties broken by
  registration order), and renders a table of those rows. Keep the chart
  helper in `src/econ/web.py`; do not add new Python modules. Draw a fan or
  line chart as inline SVG generated by the app itself, with no matplotlib
  and no external assets: horizon on the x-axis, the point forecast as a
  `<polyline>`, and the q05..q95 band as a `<polygon>` when those quantiles
  exist.

  Optional `model` and `target` query parameters select the series shown in
  the chart; unknown values fall back to the first available model/target
  instead of raising. An empty registry renders the page with an empty table
  and a valid empty SVG. `/` and `/data` gain a link to `/forecasts`.

  The view is read-only: it must not modify `registry/`, `data/`, `eval/`,
  `specs/`, or `reports/`, must not run `ingest`, `backtest`, `score`,
  `loop`, `ensemble`, `report`, or `lockbox`, and must never open the
  lockbox. Jinja2 autoescaping stays on; only the app-generated SVG is
  returned as safe markup.

  Extend `tests/test_web.py` with `/forecasts` tests. Patch
  `econ.web.read_forecasts` with a small DataFrame containing two
  registrations for one model/target/horizon and one for another, then
  assert the latest row per key is rendered, the response contains `<svg`,
  `<polyline>`, and `<polygon>`, and a `<script>` string in a model id is
  HTML-escaped in the table. Also cover the empty registry (200 with an
  empty table and a valid empty SVG) and unknown `model`/`target` query
  values falling back to the first available values. Cover the normal fan,
  a no-quantile or single-point series (polyline without polygon), and the
  empty registry so `src/econ/web.py` coverage does not drop. Use
  `fastapi.testclient.TestClient`; never start a real server in a test.
acceptance:
  - python -m pytest tests/test_web.py -q
scope:
  allow:
    - src/econ/web.py
    - src/econ/templates/forecasts.html
    - src/econ/templates/index.html
    - src/econ/templates/data.html
    - tests/test_web.py
  deny:
    - specs/**
    - data/**
    - registry/**
    - eval/**
    - sandbox/**
    - reports/**
    - config/**
    - src/econ/dev/**
    - .github/**
    - tests/dev_support.py
    - tasks/templates/**
    - dev/evals/canary/**
    - pyproject.toml
limits:
  max_review_rounds: 2
  max_usd: 5.0
  max_changed_files: 5
  max_diff_lines: 320
  wall_seconds: 2400
source:
  kind: local
notes: |
  Second of two sequential tasks split from DEV-0001. Run only after DEV-0002
  has merged: this task assumes src/econ/web.py, the templates, and
  tests/test_web.py already contain the `/` and `/data` views. fastapi,
  uvicorn, and httpx are already declared in pyproject.toml and installed in
  .venv; do not edit pyproject.toml. Keep the chart in plain Python string
  building. The registry is append-only: read it, never write it. The risk-2
  coverage gate compares `web.py` coverage to the DEV-0002 base: cover every
  new branch (fan, no quantiles, single point, empty).
retries: 0
