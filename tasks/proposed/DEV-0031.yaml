id: DEV-0031
title: Limit the theorist to drafting cards before freeze
status: proposed
risk: 2
priority: 45
created: '2026-11-24'
goal: The theorist prompt and description cover only drafting a new model card and
  its revision ladder before it is frozen. It no longer selects a rung inside the
  loop, and its output drops the rung field.
acceptance:
- python -m pytest tests/test_research_theorist.py -q
- python -m econ.cli agents check
scope:
  allow:
  - config/agents.yaml
  - config/prompts/theorist.md
  - .opencode/agents/econ-theorist.md
  - tests/test_research_theorist.py
  deny:
  - specs/**
  - data/**
  - registry/**
  - eval/**
limits:
  max_review_rounds: 2
  max_usd: 5.0
  max_changed_files: 10
  max_diff_lines: 400
source:
  kind: local
notes: 'Run after DEV-0019, which lets the implementer render research agents. Never
  hand-edit rendered files: run `python -m econ.cli agents render`. Drafts go to
  out/ only; specs/ stays untouched.'
