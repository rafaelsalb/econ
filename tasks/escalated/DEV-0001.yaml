id: DEV-0001
title: Add a read-only FastAPI dashboard for macro data and forecasts
status: escalated
risk: 2
priority: 50
created: '2026-11-24'
goal: 'Add a local read-only web dashboard launched with

  `econ web [--host 127.0.0.1] [--port 8000]`, built on FastAPI with the

  existing Jinja2 dependency. `/data` builds an `econ.vintage.Panel` for the

  requested origin (default: the latest release date visible in the curated

  data), lists catalog series with their latest visible period and value, and

  renders a monthly history for a selected series; only rows with

  `release_date <= origin` are shown and no realized outcome is joined.

  `/forecasts` reads the append-only registry through

  `econ.registry.read_forecasts()`, renders a table of the latest registered

  forecast per model/target/horizon, and draws a fan or line chart as inline

  SVG generated by the app. `/` summarizes the dashboard and links both views.

  Serving any request must not create or modify anything under `data/`,

  `registry/`, `eval/`, `specs/`, or `reports/`, must not run `ingest`,

  `backtest`, `score`, `loop`, `ensemble`, `report`, or `lockbox`, and must

  never open the lockbox. The server binds loopback by default, Jinja

  autoescaping stays enabled, and an unparseable origin or unknown series

  returns 400 instead of a traceback.

  '
acceptance:
- python -m pytest tests/test_web.py -q
- python -m econ.cli web --help
scope:
  allow:
  - src/econ/web.py
  - src/econ/templates/*.html
  - src/econ/cli.py
  - tests/test_web.py
  - pyproject.toml
  deny:
  - specs/**
  - data/**
  - registry/**
  - eval/**
  - sandbox/**
  - reports/**
  - config/**
  - src/econ/dev/**
  - .github/**
  - tests/dev_support.py
  - tasks/templates/**
  - dev/evals/canary/**
limits:
  max_review_rounds: 2
  max_usd: 8.0
  max_changed_files: 10
  max_diff_lines: 400
  wall_seconds: 2400
source:
  kind: local
notes: |
  2026-11-24: escalated: implementer produced no changes; previous failure:
  pre gates failed: size, acceptance, full_tests.
  2026-11-24: triaged as superseded by DEV-0002 (web skeleton, `/`, as-of
  `/data`, CLI) and DEV-0003 (`/forecasts`, inline SVG). Do not rerun this
  contract: it is 549 lines against a 400-line cap. Reference implementation:
  branch `dev/DEV-0001-1f45371a` at commit 39c9ce6, patch at
  `runs/dev/tasks/DEV-0001/patch.diff`.
retries: 0
