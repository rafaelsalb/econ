version: 1

# Development team roster. Rendered into .opencode/agents/dev-*.md by:
#   econ dev agents render
#
# These agents are deliberately separate from the research roster. They run
# against a writable git worktree, but they cannot touch the scientific contract
# paths and they cannot merge their own work.
defaults:
  model: opencode-go/deepseek-v4.1-flash
  variant: max
  mode: subagent
  hidden: false
  # Per-turn model-step cap. On the last step OpenCode removes tools and asks
  # the agent to summarize. Keep every agent at or below
  # dev_policy.budget.max_agent_steps; `econ dev agents check` enforces it.
  steps: 32
  timeout_s: 1200
  permissions:
    read: ["**"]
    edit: [".dev/**"]
    # Safe read-only exploration shared by the whole development roster.
    shell:
      - "ls *"
      - "pwd"
      - "cat *"
      - "head *"
      - "tail *"
      - "wc *"
      - "rg *"
      - "sed -n *"

agents:
  lead:
    description: Software lead; turns a task contract into a plan and dispatches the team. Never edits code.
    prompt: config/prompts/dev/lead.md
    mode: primary
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 40
    permissions:
      read: ["**"]
      edit: [".dev/**"]
      shell:
        - "git status *"
        - "git diff *"
        - "git log *"
        - "git show *"
        - "git rev-parse *"
        - "python -m econ.cli dev status *"
        - "python -m econ.cli dev list *"
        - "python -m econ.cli dev report *"
        - "python -m econ.cli dev validate *"
        - ".venv/bin/python -m econ.cli dev status *"
        - ".venv/bin/python -m econ.cli dev list *"
        - ".venv/bin/python -m econ.cli dev report *"
        - ".venv/bin/python -m econ.cli dev validate *"
      subagents:
        - dev-architect
        - dev-implementer
        - dev-reviewer
        - dev-reviewer_alt
        - dev-verifier
        - dev-science_guard
        - dev-scribe
        - dev-triage
        - dev-reproducer

  pm:
    description: Product manager; interviews the human, drafts and validates a proposed task contract, then hands off to the deterministic controller. Never edits code or merges.
    prompt: config/prompts/dev/pm.md
    mode: primary
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 60
    permissions:
      read: ["**"]
      edit:
        - ".dev/**"
        - "tasks/proposed/**"
      shell:
        - "git status *"
        - "git diff *"
        - "python -m econ.cli dev list *"
        - "python -m econ.cli dev status *"
        - "python -m econ.cli dev validate *"
        - ".venv/bin/python -m econ.cli dev list *"
        - ".venv/bin/python -m econ.cli dev status *"
        - ".venv/bin/python -m econ.cli dev validate *"
      subagents:
        - dev-triage
      question: allow

  architect:
    description: Design and impact analysis for risk 2 and 3 tasks; read-only except for the design artifact.
    prompt: config/prompts/dev/architect.md
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 32
    permissions:
      read: ["**"]
      edit: [".dev/**"]
      shell:
        - "git diff *"
        - "git status *"
        - "git show *"

  implementer:
    description: Writes the smallest code and test patch that satisfies the acceptance criteria.
    prompt: config/prompts/dev/implementer.md
    # Implementer quality is what the budget buys; gpt-6-luna is the cheapest
    # strong family. Bump the variant before changing the family.
    model: opencode-go/gpt-6-luna
    variant: xhigh
    steps: 60
    permissions:
      read: ["**"]
      edit:
        - ".dev/**"
        - "src/**"
        - "tests/**"
        - "docs/**"
        - "config/**"
        - "Makefile"
        - "README.md"
      shell:
        - "python -m pytest *"
        - "python -m econ.cli check *"
        - "python -m econ.cli dev validate *"
        - "python -m econ.cli --help *"
        - ".venv/bin/python -m pytest *"
        - ".venv/bin/python -m econ.cli check *"
        - ".venv/bin/python -m econ.cli dev validate *"
        - ".venv/bin/python -m econ.cli --help *"
        - "git diff *"
        - "git status *"
        - "git log *"
        - "git show *"
      deny:
        # The implementer may never change the rules of the game.
        - { action: edit, resource: "specs/**", effect: deny }
        - { action: edit, resource: "data/**", effect: deny }
        - { action: edit, resource: "registry/**", effect: deny }
        - { action: edit, resource: "eval/**", effect: deny }
        - { action: edit, resource: "sandbox/**", effect: deny }
        - { action: edit, resource: "src/econ/evaluate.py", effect: deny }
        - { action: edit, resource: "src/econ/critics.py", effect: deny }
        - { action: edit, resource: "src/econ/diagnostics.py", effect: deny }
        - { action: edit, resource: "src/econ/loop.py", effect: deny }
        - { action: edit, resource: "src/econ/lockbox.py", effect: deny }
        - { action: edit, resource: "src/econ/vintage.py", effect: deny }
        - { action: edit, resource: "src/econ/checks.py", effect: deny }
        - { action: edit, resource: "config/dev_policy.yaml", effect: deny }
        - { action: edit, resource: "config/dev_agents.yaml", effect: deny }

  reviewer:
    description: Blind code review of the commit diff and test evidence. Cannot edit code.
    prompt: config/prompts/dev/reviewer.md
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 32
    permissions:
      read: ["**"]
      edit: [".dev/**"]
      shell:
        - "git diff *"
        - "git status *"
        - "git show *"
        - "python -m pytest *"
        - ".venv/bin/python -m pytest *"

  reviewer_alt:
    description: Second independent reviewer on a different model family, used for risk 2 auto-merges.
    prompt: config/prompts/dev/reviewer.md
    model: opencode-go/gpt-6-luna
    variant: high
    steps: 32
    permissions:
      read: ["**"]
      edit: [".dev/**"]
      shell:
        - "git diff *"
        - "git status *"
        - "git show *"
        - "python -m pytest *"
        - ".venv/bin/python -m pytest *"

  verifier:
    description: Independent acceptance and regression verification on the patch, not the agent worktree.
    prompt: config/prompts/dev/verifier.md
    # The verifier is the real second opinion for risk 0/1: careful and
    # skeptical, on a different family from the implementer. The mechanical
    # gates carry the actual verification authority.
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 40
    permissions:
      read: ["**"]
      edit: [".dev/**"]
      shell:
        - "python -m pytest *"
        - "python -m econ.cli check *"
        - "python -m econ.cli dev validate *"
        - "python -m econ.cli --help *"
        - ".venv/bin/python -m pytest *"
        - ".venv/bin/python -m econ.cli check *"
        - ".venv/bin/python -m econ.cli dev validate *"
        - ".venv/bin/python -m econ.cli --help *"
        - "git diff *"
        - "git status *"
        - "git show *"

  science_guard:
    description: Guards the scientific contract, protected paths, lockbox, registry append-only rule, and determinism.
    prompt: config/prompts/dev/science_guard.md
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 32
    permissions:
      read: ["**"]
      edit: [".dev/**"]
      shell:
        - "git diff *"
        - "git status *"
        - "git show *"
        - "python -m econ.cli check *"
        - "python -m econ.cli dev validate *"
        - ".venv/bin/python -m econ.cli check *"
        - ".venv/bin/python -m econ.cli dev validate *"

  scribe:
    description: Documents approved changes; docs only, no code and no protected paths.
    prompt: config/prompts/dev/scribe.md
    model: opencode-go/glm-5.3-flash
    variant: null
    steps: 24
    permissions:
      read: ["**"]
      edit:
        - ".dev/**"
        - "README.md"
        - "CHANGELOG.md"
        - "docs/**"
      shell: []

  triage:
    description: Turns a GitHub issue into a runnable task contract and classifies risk.
    prompt: config/prompts/dev/triage.md
    model: opencode-go/glm-5.3-flash
    variant: null
    steps: 24
    permissions:
      read: ["**"]
      edit:
        - ".dev/**"
        - "tasks/proposed/**"
      shell: []

  reproducer:
    description: Turns a bug report into a minimal failing test before implementation.
    prompt: config/prompts/dev/reproducer.md
    model: opencode-go/deepseek-v4.1-flash
    variant: max
    steps: 36
    permissions:
      read: ["**"]
      edit:
        - ".dev/**"
        - "tests/**"
      shell:
        - "python -m pytest *"
        - ".venv/bin/python -m pytest *"
